name: phototimelapse
description: "OneFrame: a private-by-choice daily face timelapse app."
publish_to: none
version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  camera: ^0.12.0+2
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  ffmpeg_kit_flutter_new_min: ^3.6.2
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  go_router: ^17.5.0
  google_mlkit_face_detection: ^0.15.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image: ^4.9.2
  in_app_purchase: ^3.3.0
  intl: ^0.20.2
  file_picker: ^12.1.2
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  table_calendar: ^3.2.1
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/oneframe_icon.png
